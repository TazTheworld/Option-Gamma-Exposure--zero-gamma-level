# Moteur gamma exposure sur options du Nasdaq (NQ, CME), en Rust.
#
# La decoupe en crates n'est pas cosmetique : elle rend structurel ce que le
# depot Python n'imposait que par convention. `gex-core` ne declare aucune
# dependance capable d'ouvrir un fichier ou un socket, donc « tout ce qui produit
# un chiffre est testable sans reseau » cesse d'etre une regle qu'on peut
# enfreindre par distraction — le compilateur la refuse.

[workspace]
resolver = "3"
members = ["crates/gex-core", "crates/gex-store", "crates/gex-cli", "crates/gex-ib", "crates/gex-collector"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TazTheworld/Option-Gamma-Exposure--zero-gamma-level"

[workspace.dependencies]
libm = "0.2"
# `default-features = false` retire la feature "clock", donc Utc::now() et Local
# n'existent PAS. Ce n'est pas de l'economie de compilation : c'est la garantie
# que gex-core ne peut pas lire l'horloge. L'instant de valorisation lui est
# passe, toujours, et un calcul qui dependrait de l'heure courante ne compilerait
# pas - ce qui rend tout resultat reproductible par construction.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# La base IANA embarquee en donnees statiques : aucune lecture de /usr/share.
chrono-tz = "0.10"

[profile.release]
lto = true
codegen-units = 1
