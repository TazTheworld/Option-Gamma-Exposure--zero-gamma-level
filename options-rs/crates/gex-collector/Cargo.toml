[package]
name = "gex-collector"
description = "Le demon : socle quotidien, vif entretenu, releve courant reecrit."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gex-collector"
path = "src/main.rs"

[dependencies]
gex-core = { path = "../gex-core" }
gex-ib = { path = "../gex-ib" }
gex-store = { path = "../gex-store" }
# Le collecteur est le SEUL a lire l'horloge : la feature clock est ici, et
# nulle part ailleurs. C'est ce qui garde tout le calcul reproductible.
chrono = { version = "0.4", features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
ibapi = { version = "3.3", default-features = false, features = ["sync"] }
ctrlc = "3.5.2"
# Pur Rust, aucune dependance a code C : l arbre reste compilable pour aarch64
# sans chaine croisee, ce qui est la raison pour laquelle zstd en avait ete
# retire. Sert uniquement a former la charge des alertes.
serde_json = "1"
