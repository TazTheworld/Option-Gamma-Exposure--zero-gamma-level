# Pourquoi cette CI ne fait presque rien.
#
# Elle avait ete retiree une fois, deliberement, parce qu'elle rejouait ce que
# `cargo test` et `cargo clippy` font deja sur le poste avant de pousser. Le
# raisonnement tenait : une CI qui repete un geste qu'on fait de toute facon
# n'apprend rien, et son feu vert finit par ne plus rien vouloir dire.
#
# Il reste pourtant une question que le poste ne peut pas poser. Le
# developpement se fait en x86_64, la machine visee est un Raspberry Pi en
# aarch64, et aucune commande lancee a la main sur le poste ne dira si l'arbre
# tient sur l'autre architecture. C'est le seul travail garde ici, et c'est
# pourquoi la CI se reduit a lui.
#
# `cargo clippy` reste a la main, comme le dit AGENTS.md. Le formatage, lui, est
# verifie : il ne l'etait pas tant que le depot portait quatre-vingt-dix ecarts
# anterieurs, le compte est desormais a zero, et c'est la condition que l'ancien
# fichier posait lui-meme pour le brancher.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  aarch64:
    name: Tests sur l'architecture du Pi
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: options-rs
      # Compilation NATIVE, pas croisee : le runner est lui-meme en aarch64, donc
      # les tests s'executent vraiment sur l'architecture de destination au lieu
      # d'etre seulement compiles pour elle.
      - name: Tests
        run: cargo test --workspace --manifest-path options-rs/Cargo.toml
      - name: Formatage
        run: cargo fmt --all --check --manifest-path options-rs/Cargo.toml
