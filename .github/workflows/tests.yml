name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer la chaine Rust
        run: rustup update stable && rustup default stable && rustup component add clippy

      - name: Tests
        # Aucun test ne touche au reseau, ni a TWS : gex-core ne declare aucune
        # dependance capable d'ouvrir un fichier ou un socket, et c'est le
        # compilateur qui l'impose.
        working-directory: options-rs
        run: cargo test --workspace

      - name: Clippy
        working-directory: options-rs
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        # Il ne reste que sec_data.py : le moteur d'options est en Rust.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        run: python -m pytest tests -q
