name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow
          # Aucun test n'importe ib_async : les fonctions pures d'ib_data se
          # verifient hors ligne, et c'est voulu. L'extra s'installe quand meme,
          # parce que c'est la seule chose qui verifie qu'il se resout — une
          # version incompatible ne se decouvrirait sinon qu'au lancement du
          # collecteur, sur une machine ou TWS tourne deja.
          pip install -e ".[ib]"

      - name: Tests
        # Aucun test ne touche au reseau : la suite doit passer telle quelle.
        run: python -m pytest tests -q
