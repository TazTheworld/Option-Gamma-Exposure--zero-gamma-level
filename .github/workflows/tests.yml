name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # databento porte databento_dbn, dont dependent les tests de
          # build_chain. Sans lui ils se sautent, et le parseur CME n'est
          # plus couvert : la CI doit donc installer l'extra, pas s'en passer.
          pip install pytest pyarrow databento

      - name: Tests
        # Aucun test ne touche au reseau : la suite doit passer telle quelle.
        run: python -m pytest tests -q
