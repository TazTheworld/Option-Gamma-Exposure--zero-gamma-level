[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-gamma-exposure"
version = "1.1.0"
description = "Gamma exposure, zero gamma level, charm et vanna a partir de donnees d'options gratuites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Taz" }]

# Tout le moteur d'options est passe en Rust : voir options-rs/. Ce qui reste
# ici est sec_data.py, la lecture des declarations d'inities aupres de la SEC,
# qui n'a jamais dependu du reste et attend son propre dossier.
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/TazTheworld/Option-Gamma-Exposure--zero-gamma-level"

[tool.setuptools]
py-modules = ["sec_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
